sources:
  - U.S. Bureau of Labor Statistics, CPI-U (NSA), Jan 2020 to Dec 2025 — food at home CUUR0000SAF11 +29.8%; motor vehicle insurance CUUR0000SETE +55.9%
  - Meyer, Wyse et al., linked IRS/Census administrative wage data, 2011–2018, Journal of Public Economics (2021) — 53% of sheltered and 40% of unsheltered people had formal earnings in the year of homelessness (the "more than half … earned wages that same year" line)
  - Gregg Colburn and Clayton Page Aldern, Homelessness Is a Housing Problem (University of California Press, 2022) — regional variation explained by rents and rental vacancy, not drug use, mental illness, poverty, weather, or welfare generosity
  - National Low Income Housing Coalition, Out of Reach 2025 — $33.63 national two-bedroom Housing Wage, about 4.6 times the $7.25 federal minimum (unchanged since 2009); no county where a full-time minimum-wage job affords it
  - U.S. Department of Housing and Urban Development, 2025 Annual Homelessness Assessment Report, Part 1 (January 2025 point-in-time count) — 745,652 people, the second-highest on record after 771,480 in 2024
  - National Low Income Housing Coalition, The Gap (2026) — a shortage of 7.2 million homes for extremely low-income renters

