title: "The Days at Risk counter is built for exactly that lag. It measures the number of days a risk exists in the world before any institution has named it as a risk at recognition-grade. Before it has a classification that triggers a defensive response proportionate to its capability. Before it appears on a threat advisory, a regulatory schedule, a procurement gate, or the agenda of a board meeting that has the authority to do anything about it."
