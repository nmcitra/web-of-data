  - USGS SIM 3083; New Mexico Bureau of Geology and Mineral Resources (West Mesa as an older basin surface, not the rift wall)
  - USGS Circular 1222; USGS Professional Paper 1781 (basin fill, rift onset)
  - KUNM, 2026-08-07 (Albuquerque reach dry, Paseo del Norte to Rio Bravo; 2022 the first in ~40 years)
  - Middle Rio Grande Conservancy District and federal channelization records (levees 1930s; straightening 1950s–60s)

