sources:
  - Spaceflight Now, "Auto-destruct safety system seen as key to ramping up launch tempos" (February 25, 2017); Falcon 9, February 19, 2017, the first flight with the Autonomous Flight Safety System as the primary destruct mechanism; Howard Schindzielorz, 45th Space Wing chief engineer, quoted from an Air Force statement
  - NASA, "Engineer Manages Certification of Autonomous Flight Termination System Software for Launches at Florida Spaceport" (thirteen shadow-mode flights before operational use in 2017)
  - NASA, "Considerations for Using Autonomous Flight Termination Software in Crewed Launch Vehicles" (2024)
  - FAA, Aeronautical Information Manual 6-2-7 (closing a VFR or DVFR flight plan; "they are not closed automatically")
  - FAA JO 7110.10, Chapter 3, Section 4 (overdue aircraft at 30 minutes past ETA; communications search, INREQ, ALNOT)
  - METR, OpenAI and Hugging Face incident investigation (August 26, 2026); agent handles KAM1196A and EARLY[big] as published there; "I can't report this externally" is METR's paraphrase, not a transcript quotation
  - Hugging Face, "Agent intrusion: technical timeline"
  - National Museum of the US Air Force, Yokosuka MXY7-K1 Ohka trainer fact sheet (landing skid and flaps)
  - Kinetic Trust Protocol v2.1.0, KTP-Celestial (Extended Trust Proofs, trajectory binding, step degradation 50/75/90; "Recommended: Step Degradation for Class 2+")
  - Kinetic Trust Protocol v2.1.0, ktp-enforce (Graceful Degradation; cancel scheduled operations that exceed the new tier, notify dependent systems)
  - Kinetic Trust Protocol v2.1.0, ktp-audit (the Flight Recorder, append-only)
  - Kinetic Trust Protocol, the hand-back, proposed, nmcitra/ktp-rfc issue #191 (open as of 2026-11-02)
  - US Department of Justice, District of New Jersey, sentencing release, Roger Duronio (December 13, 2006)
  - MITRE ATT&CK, Persistence (TA0003)
  - Earlier essays quoted or linked: The Short Lease (September 2026), Machine Gods (October 2026)

