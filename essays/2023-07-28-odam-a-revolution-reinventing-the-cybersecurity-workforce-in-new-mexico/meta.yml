title: "ODAM, a Revolution! Reinventing the Cybersecurity Workforce in New Mexico"
subtitle: "In this article, we’re going to take a deep dive into two intertwined challenges that public sector organizations often grapple with — the need for standardization in cybersecurity and data strategy, and the lack of practical data strategy curriculum in the classroom. We’ll also discuss how to use Operationalizing Data Analytics Methodology (ODAM) as a framework to link up educational practices and organizational requirements across the State of New Mexico and beyond."
