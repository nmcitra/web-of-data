notes: >
  Text captured from the author's copy of the published Medium final (2026-09-29),
  plus the Tamed Autonomy link he added after that copy. The book-page photographs
  stand in for the Leopold and Kimmerer quotations; the typed quotations were removed
  before publication. The reading of the day draws on Damian Kemm's account and his
  read-back edits; he is written in close third person and never quoted.

